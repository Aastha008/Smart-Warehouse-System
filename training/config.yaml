# Training Configuration

model:
  name: yolov8s
  weights: yolov8s.pt
  
training:
  epochs: 50
  batch_size: 16
  img_size: 640
  patience: 10
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  save_period: 10
  
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  
paths:
  project: training/experiments
  name: warehouse_detection
  data: data/warehouse_dataset.yaml
  
evaluation:
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 300
